<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARTI - Seu Consultor Financeiro IA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      min-height: 100vh;
    }

    .marti-container {
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
    }

    /* SIDEBAR - HISTÓRICO */
    .marti-sidebar {
      width: 200px;
      background: rgba(10, 14, 39, 0.9);
      border-right: 1px solid rgba(16, 185, 129, 0.2);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .marti-sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .marti-sidebar::-webkit-scrollbar-track {
      background: rgba(16, 185, 129, 0.1);
    }

    .marti-sidebar::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
      border-radius: 3px;
    }

    .marti-historico-title {
      font-size: 11px;
      color: #10b981;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: 1.5px;
    }

    .historico-item {
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(16, 185, 129, 0.08);
      border-left: 3px solid #10b981;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      line-height: 1.4;
    }

    .historico-item:hover {
      background: rgba(16, 185, 129, 0.15);
      transform: translateX(5px);
    }

    .historico-item.active {
      background: rgba(16, 185, 129, 0.2);
      border-left-color: #059669;
    }

    .historico-time {
      font-size: 10px;
      color: #888;
      margin-top: 6px;
    }

    /* MAIN AREA */
    .marti-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0f1729 0%, #1a1f3a 100%);
    }

    /* HEADER COM CONTADOR */
    .marti-header {
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.2);
      animation: glow 3s ease-in-out infinite;
    }

    .marti-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 20px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-2px);
    }

    .marti-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      flex: 1;
      text-align: center;
    }

    .marti-header-bottom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .marti-usage-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 500;
    }

    .usage-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .usage-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      width: 90%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* CHAT AREA */
    .marti-chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
    }

    .marti-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .marti-messages::-webkit-scrollbar {
      width: 6px;
    }

    .marti-messages::-webkit-scrollbar-track {
      background: rgba(16, 185, 129, 0.05);
    }

    .marti-messages::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.ai .message-bubble {
      background: rgba(16, 185, 129, 0.15);
      border-left: 3px solid #10b981;
      color: #e0e0e0;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border-radius: 12px 0px 12px 12px;
    }

    /* INPUT AREA */
    .marti-input-area {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .marti-input-wrapper {
      flex: 1;
      display: flex;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .marti-input-wrapper:focus-within {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .marti-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }

    .marti-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .marti-send-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .marti-send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .marti-send-btn:active {
      transform: translateY(0);
    }

    .marti-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ANIMAÇÕES */
    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      }
      50% {
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    @keyframes typing {
      0%, 20%, 50%, 80%, 100% {
        opacity: 1;
      }
      40% {
        opacity: 0.3;
      }
      60% {
        opacity: 0.7;
      }
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(16, 185, 129, 0.15);
      border-left: 3px solid #10b981;
      border-radius: 12px;
      max-width: 80px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .error-message {
      color: #f87171;
      font-size: 12px;
      padding: 8px;
      background: rgba(248, 113, 113, 0.1);
      border-left: 3px solid #f87171;
      border-radius: 6px;
    }

    /* THINKING INDICATOR - Tipo Claude */
    @keyframes thinking-pulse {
      0%, 100% {
        opacity: 0.4;
      }
      50% {
        opacity: 1;
      }
    }

    .thinking-indicator {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      padding: 4px 0;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: thinking-pulse 1s ease-in-out infinite;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
  </style>
</head>
<body>
  <div class="marti-container">
    <!-- SIDEBAR - HISTÓRICO -->
    <div class="marti-sidebar">
      <div class="marti-historico-title">📌 Histórico</div>
      <div id="historico-container"></div>
    </div>

    <!-- MAIN AREA -->
    <div class="marti-main">
      <!-- HEADER COM CONTADOR -->
      <div class="marti-header">
        <div class="marti-header-top">
          <button onclick="window.location.href='/app'" class="back-btn" title="Voltar">
            <span style="font-size: 20px;">←</span>
          </button>
          <div class="marti-title">MARTI</div>
        </div>
        <div class="marti-header-bottom">
          <div class="marti-usage-text" id="usage-text">Premium: 0/50 perguntas usadas</div>
          <div class="usage-bar">
            <div class="usage-fill" id="usage-fill"></div>
          </div>
        </div>
      </div>

      <!-- CHAT -->
      <div class="marti-chat-container">
        <div class="marti-messages" id="marti-messages">
          <div class="message ai">
            <div class="message-bubble">
              👋 Olá! Sou o MARTI, seu consultor financeiro IA. Como posso ajudar com suas finanças?
            </div>
          </div>
        </div>

        <!-- INPUT -->
        <div class="marti-input-area">
          <div class="marti-input-wrapper">
            <input type="text" class="marti-input" id="marti-input" placeholder="Digite sua pergunta aqui..." />
          </div>
          <button class="marti-send-btn" id="marti-send-btn">▶️</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO SUPABASE
    // ============================================
    const SUPABASE_URL = localStorage.getItem('supabase_url') || 'https://seu-projeto.supabase.co';
    const SUPABASE_KEY = localStorage.getItem('supabase_key') || 'sua-chave-publica';
    const CLAUDE_API_ENDPOINT = localStorage.getItem('claude_endpoint') || '/api/claude';
    const CLAUDE_API_KEY = localStorage.getItem('claude_api_key') || '';

    let supabase = null;
    let userId = null;
    let userPlan = 'premium';
    let messagesUsedToday = 0;
    let maxMessagesPerDay = 50;

    // Inicializar Supabase
    async function initSupabase() {
      try {
        const { createClient } = window.supabase;
        supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Pegar usuário logado
        const { data: { user }, error } = await supabase.auth.getUser();

        if (error || !user) {
          console.log('Usuário não autenticado. Usando modo demo.');
          userId = 'demo-user';
          return;
        }

        userId = user.id;
        await loadUserPlanAndUsage();
      } catch (error) {
        console.error('Erro ao inicializar Supabase:', error);
        addErrorMessage('Erro ao conectar com o banco de dados');
      }
    }

    // Carregar plano e uso do usuário
    async function loadUserPlanAndUsage() {
      if (!supabase || !userId) return;

      try {
        // Buscar dados do usuário
        const { data: userData, error: userError } = await supabase
          .from('users')
          .select('plan')
          .eq('id', userId)
          .single();

        if (!userError && userData) {
          userPlan = userData.plan || 'premium';
          maxMessagesPerDay = userPlan === 'smartico' ? 200 : 50;
        }

        // Buscar uso de hoje
        const today = new Date().toISOString().split('T')[0];
        const { data: usage, error: usageError } = await supabase
          .from('marti_usage')
          .select('message_count')
          .eq('user_id', userId)
          .eq('date', today)
          .single();

        if (!usageError && usage) {
          messagesUsedToday = usage.message_count || 0;
        } else {
          messagesUsedToday = 0;
        }

        updateUsageBar();
      } catch (error) {
        console.error('Erro ao carregar uso:', error);
      }
    }

    // ============================================
    // UI FUNCTIONS
    // ============================================
    const input = document.querySelector('.marti-input');
    const sendBtn = document.querySelector('.marti-send-btn');
    const messagesContainer = document.querySelector('#marti-messages');

    function addThinkingIndicator() {
      const thinkingMsg = document.createElement('div');
      thinkingMsg.className = 'message ai';
      thinkingMsg.id = 'thinking-indicator';
      thinkingMsg.innerHTML = `
        <div class="thinking-indicator">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
      `;
      messagesContainer.appendChild(thinkingMsg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return thinkingMsg;
    }

    function addAIResponse(text) {
      const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      messagesContainer.appendChild(aiMsg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addErrorMessage(text) {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = `<div class="error-message">${escapeHtml(text)}</div>`;
      messagesContainer.appendChild(aiMsg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function updateUsageBar() {
      const percentage = (messagesUsedToday / maxMessagesPerDay) * 100;
      document.querySelector('#usage-text').textContent =
        `${userPlan === 'smartico' ? 'Smartico' : 'Premium'}: ${messagesUsedToday}/${maxMessagesPerDay} perguntas usadas`;
      document.querySelector('#usage-fill').style.width = percentage + '%';

      if (messagesUsedToday >= maxMessagesPerDay) {
        addErrorMessage(`⚠️ Você atingiu o limite de ${maxMessagesPerDay} perguntas para hoje. Tente novamente amanhã!`);
        sendBtn.disabled = true;
      } else {
        sendBtn.disabled = false;
      }
    }

    // ============================================
    // CLAUDE API
    // ============================================
    async function callClaudeAPI(userMessage) {
      try {
        // Opção 1: Chamar via backend endpoint (recomendado)
        const response = await fetch(CLAUDE_API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${CLAUDE_API_KEY}`
          },
          body: JSON.stringify({
            message: userMessage,
            userId: userId,
            userPlan: userPlan
          })
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        return data.response || 'Desculpe, não consegui processar sua pergunta.';
      } catch (error) {
        console.error('Erro ao chamar Claude API:', error);

        // Fallback: resposta genérica
        return '💭 Desculpe, não consegui conectar com a IA neste momento. Verifique suas configurações de API.';
      }
    }

    // ============================================
    // SUPABASE - SALVAR MENSAGEM
    // ============================================
    async function saveMessageToDatabase(userMessage, aiResponse) {
      if (!supabase || !userId) return;

      try {
        // Salvar mensagem
        const { error: insertError } = await supabase
          .from('marti_messages')
          .insert([{
            user_id: userId,
            user_message: userMessage,
            ai_response: aiResponse,
            created_at: new Date().toISOString()
          }]);

        if (insertError) {
          console.error('Erro ao salvar mensagem:', insertError);
          return;
        }

        // Atualizar contador de uso
        const today = new Date().toISOString().split('T')[0];
        const { data: existingUsage } = await supabase
          .from('marti_usage')
          .select('id, message_count')
          .eq('user_id', userId)
          .eq('date', today)
          .single();

        if (existingUsage) {
          // Atualizar contador existente
          await supabase
            .from('marti_usage')
            .update({ message_count: existingUsage.message_count + 1 })
            .eq('id', existingUsage.id);
        } else {
          // Criar novo contador
          await supabase
            .from('marti_usage')
            .insert([{
              user_id: userId,
              date: today,
              message_count: 1
            }]);
        }

        messagesUsedToday++;
        updateUsageBar();
      } catch (error) {
        console.error('Erro ao salvar no banco:', error);
      }
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });

    sendBtn.addEventListener('click', async () => {
      const message = input.value.trim();
      if (!message || sendBtn.disabled) return;

      // Verificar limite
      if (messagesUsedToday >= maxMessagesPerDay) {
        addErrorMessage(`⚠️ Limite de ${maxMessagesPerDay} perguntas atingido!`);
        return;
      }

      sendBtn.disabled = true;

      // Adicionar mensagem do usuário
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
      messagesContainer.appendChild(userMsg);

      input.value = '';
      input.style.height = 'auto';

      // Mostrar indicador de "pensando"
      addThinkingIndicator();

      // Chamar Claude API
      const aiResponse = await callClaudeAPI(message);

      // Remover indicador e adicionar resposta
      const thinkingEl = document.getElementById('thinking-indicator');
      if (thinkingEl) thinkingEl.remove();

      addAIResponse(aiResponse);

      // Salvar no banco de dados
      await saveMessageToDatabase(message, aiResponse);

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      sendBtn.disabled = false;
      input.focus();
    });

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    async function init() {
      await initSupabase();
      updateUsageBar();
      input.focus();

      // Verificar se há configurações faltando
      if (!CLAUDE_API_KEY || SUPABASE_URL.includes('seu-projeto')) {
        addErrorMessage('⚠️ Configure as variáveis de ambiente (Claude API Key e Supabase)');
      }
    }

    // Iniciar aplicação
    init();
  </script>
</body>
</html>
