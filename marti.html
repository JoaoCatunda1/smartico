<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARTI - Consultor IA Financeiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --neon: #4ade80;
      --bg-dark: #0a0e27;
      --bg-card: #1a1f3a;
      --text-light: #e0e0e0;
      --text-muted: #888;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #0f1729 100%);
      color: var(--text-light);
      min-height: 100vh;
      overflow: hidden;
    }

    /* CONTAINER */
    .marti-container {
      display: flex;
      height: 100vh;
      gap: 0;
    }

    /* SIDEBAR - HISTÓRICO */
    .marti-sidebar {
      width: 220px;
      background: rgba(10, 14, 39, 0.95);
      border-right: 1px solid rgba(16, 185, 129, 0.15);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 12px;
    }

    .sidebar-header {
      font-size: 11px;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .sidebar-item {
      padding: 12px 10px;
      margin-bottom: 8px;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-light);
      border-left: 3px solid transparent;
    }

    .sidebar-item:hover {
      background: rgba(16, 185, 129, 0.12);
      border-left-color: var(--primary);
      transform: translateX(4px);
    }

    .sidebar-item.active {
      background: rgba(16, 185, 129, 0.15);
      border-left-color: var(--neon);
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.2);
    }

    .sidebar-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* MAIN AREA */
    .marti-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0f1729 0%, #1a1f3a 100%);
    }

    /* HEADER */
    .marti-header {
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
      border-bottom: 1px solid rgba(74, 222, 128, 0.2);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 18px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-2px);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .usage-info {
      text-align: right;
      font-size: 12px;
    }

    .usage-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* CHAT AREA */
    .marti-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
    }

    .messages-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 8px;
    }

    .messages-wrapper::-webkit-scrollbar {
      width: 6px;
    }

    .messages-wrapper::-webkit-scrollbar-track {
      background: rgba(16, 185, 129, 0.05);
      border-radius: 3px;
    }

    .messages-wrapper::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 3px;
    }

    .messages-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.5);
    }

    /* MENSAGENS */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.ai .message-bubble {
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--primary);
      color: var(--text-light);
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-radius: 12px 0px 12px 12px;
    }

    /* THINKING INDICATOR */
    .thinking-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(16, 185, 129, 0.12);
      border-left: 3px solid var(--primary);
      border-radius: 12px;
      width: fit-content;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* INPUT AREA */
    .marti-input-area {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding-top: 16px;
      border-top: 1px solid rgba(16, 185, 129, 0.1);
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .marti-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }

    .marti-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .send-btn:active {
      transform: translateY(0);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .marti-container {
        flex-direction: column;
      }

      .marti-sidebar {
        width: 100%;
        height: auto;
        padding: 12px;
        border-right: none;
        border-bottom: 1px solid rgba(16, 185, 129, 0.15);
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
      }

      .sidebar-header {
        display: none;
      }

      .sidebar-item {
        padding: 8px;
        margin-bottom: 0;
        font-size: 11px;
      }

      .message-bubble {
        max-width: 85%;
      }

      .marti-chat {
        padding: 16px;
      }
    }

    @media (max-width: 480px) {
      .header-right {
        display: none;
      }

      .header-title {
        font-size: 18px;
      }

      .message-bubble {
        max-width: 90%;
        font-size: 13px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="marti-container">
    <!-- SIDEBAR -->
    <div class="marti-sidebar">
      <div class="sidebar-header">Histórico</div>
      <div class="sidebar-item active" onclick="selectHistory(this)">
        <div>Comissões e vendas</div>
        <div class="sidebar-time">Agora</div>
      </div>
      <div class="sidebar-item" onclick="selectHistory(this)">
        <div>Análise de gastos</div>
        <div class="sidebar-time">2h atrás</div>
      </div>
      <div class="sidebar-item" onclick="selectHistory(this)">
        <div>Meta de economia</div>
        <div class="sidebar-time">1 dia</div>
      </div>
      <div class="sidebar-item" onclick="selectHistory(this)">
        <div>Fluxo de caixa</div>
        <div class="sidebar-time">3 dias</div>
      </div>
      <div class="sidebar-item" onclick="selectHistory(this)">
        <div>Cálculo de juros</div>
        <div class="sidebar-time">1 sem</div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="marti-main">
      <!-- HEADER -->
      <div class="marti-header">
        <div class="header-left">
          <button class="back-btn" onclick="window.location.href='/app'" title="Voltar">&larr;</button>
          <div class="header-title">MARTI</div>
        </div>
        <div class="header-right">
          <div class="usage-info">
            <div style="color: rgba(255,255,255,0.7); font-size: 11px;">PREMIUM</div>
            <div class="usage-value" id="usage-counter">0/50</div>
          </div>
        </div>
      </div>

      <!-- CHAT -->
      <div class="marti-chat">
        <div class="messages-wrapper" id="messages">
          <div class="message ai">
            <div class="message-bubble">
              Olá! Sou o MARTI, seu consultor financeiro IA. Como posso ajudar com suas finanças?
            </div>
          </div>
        </div>

        <!-- INPUT -->
        <div class="marti-input-area">
          <div class="input-wrapper">
            <input
              type="text"
              class="marti-input"
              id="marti-input"
              placeholder="Faça uma pergunta sobre suas finanças..."
              onkeypress="handleKeyPress(event)"
            />
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">&rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const inputField = document.getElementById('marti-input');
    const sendBtn = document.getElementById('send-btn');
    const usageCounter = document.getElementById('usage-counter');

    let messagesCount = 0;
    const maxMessages = 50;

    // MOCK RESPONSES (quando API não responde)
    const mockResponses = [
      'Com base em seus gastos, identifiquei que você gasta em média R$ 1.200/mês com alimentação. Se reduzir para R$ 800, economiza R$ 4.800/ano.',
      'Sua margem de lucro está em 22%. Recomendo diversificar sua renda para aumentar esse percentual.',
      'Você tem R$ 3.400 disponíveis em liquidez. Seria uma boa oportunidade investir 30% em renda fixa.',
      'Identifiquei um padrão: seus maiores gastos são nas terças-feiras. Pode ser um excelente dia para planejar compras.',
      'Seu fluxo de caixa está positivo em R$ 2.100 esse mês. Continue assim!',
      'Se você poupar R$ 500/mês, em 1 ano terá uma reserva de emergência completa.',
      'Detectei que você está pagando R$ 89/mês em assinaturas que não usa. Poderia economizar R$ 1.068/ano!',
    ];

    function sendMessage() {
      const message = inputField.value.trim();
      if (!message || sendBtn.disabled) return;

      // Verificar limite
      if (messagesCount >= maxMessages) {
        addMessage('Você atingiu o limite de 50 perguntas. Faça upgrade para Smartico para mais acesso.', 'ai');
        return;
      }

      // Adicionar mensagem do usuário
      addMessage(message, 'user');
      inputField.value = '';
      inputField.style.height = 'auto';

      sendBtn.disabled = true;

      // Mostrar thinking indicator
      const thinkingMsg = document.createElement('div');
      thinkingMsg.className = 'message ai';
      thinkingMsg.id = 'thinking';
      thinkingMsg.innerHTML = `
        <div class="thinking-indicator">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
      `;
      messagesDiv.appendChild(thinkingMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Simular resposta (substituir por API real depois)
      setTimeout(() => {
        const thinking = document.getElementById('thinking');
        if (thinking) thinking.remove();

        const response = mockResponses[Math.floor(Math.random() * mockResponses.length)];
        addMessage(response, 'ai');

        messagesCount++;
        updateUsageCounter();

        sendBtn.disabled = false;
        inputField.focus();
      }, 1500);
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function updateUsageCounter() {
      usageCounter.textContent = `${messagesCount}/${maxMessages}`;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function selectHistory(element) {
      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
      });
      element.classList.add('active');
    }

    inputField.addEventListener('input', () => {
      inputField.style.height = 'auto';
      inputField.style.height = Math.min(inputField.scrollHeight, 100) + 'px';
    });

    inputField.focus();
  </script>
</body>
</html>
